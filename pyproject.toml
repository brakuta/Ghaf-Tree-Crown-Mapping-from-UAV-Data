[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ghaf-crown-mapping"
version = "1.0.0"
description = "Ghaf (Prosopis cineraria) tree-crown mapping from area-wide UAV imagery"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.24,<2",   # matches the NumPy 1.x ABI of PyTorch 1.12.1
    "timm==1.0.19",
]

[project.optional-dependencies]
geo = ["rasterio>=1.3", "geopandas>=0.13", "shapely>=2.0", "tqdm>=4.65"]
test = ["pytest>=7.0", "mmengine==0.10.7"]

[project.scripts]
ghaf-predict = "ghaf.inference.large_image:main"

[project.urls]
Repository = "https://github.com/brakuta/Ghaf-Tree-Crown-Mapping-from-UAV-Data"

[tool.setuptools.packages.find]
include = ["ghaf*"]

[tool.setuptools.package-data]
ghaf = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
# Linting only. The formatter is not used: it is Black-style, whereas this
# code follows the OpenMMLab conventions of the surrounding ecosystem.
line-length = 88
target-version = "py39"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, comprehensions, pyupgrade, simplify.
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = [
    "E501",    # long lines are caught in review, not by a counter
    # dict(...) is the OpenMMLab idiom: every mmengine config and model
    # definition is written that way, so literals would fight the ecosystem.
    "C408",
    # PEP 604 unions and builtin generics need Python 3.10; this targets 3.9.
    "UP006", "UP007", "UP035", "UP045",
]

[tool.ruff.lint.per-file-ignores]
# Configs are mmengine data files, not modules: they define names at import
# time that a linter cannot see used.
"configs/**" = ["F821", "E501"]
# Vendored from Apple's FastViT; kept close to upstream so it stays diffable.
"ghaf/models/fastvit.py" = ["ALL"]
"ghaf/models/modules/*.py" = ["ALL"]
