[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ghaf-crown-mapping"
version = "1.0.0"
description = "Ghaf (Prosopis cineraria) tree-crown mapping from area-wide UAV imagery"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.24",
    "timm==1.0.19",
]

[project.optional-dependencies]
geo = ["rasterio>=1.3", "geopandas>=0.13", "shapely>=2.0", "tqdm>=4.65"]
test = ["pytest>=7.0", "mmengine==0.10.7"]

[project.scripts]
ghaf-predict = "ghaf.inference.large_image:main"

[tool.setuptools.packages.find]
include = ["ghaf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
