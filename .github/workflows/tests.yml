name: tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install ruff
      - run: ruff check .

  core:
    # The suite needs no GPU, no mmcv and no dataset. Tests that require the
    # optional geospatial and model stacks skip themselves, so this job proves
    # the configs, the registry and the tiling mathematics on a bare runner.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "mmengine==0.10.7" "numpy>=1.24" "pytest>=7.0"
      - name: Test
        run: pytest tests/ -q

  full:
    # Adds the optional stacks so the backbone, inference and prediction tests
    # actually run. Two ordering rules matter here:
    #   * torch comes from the CPU index on its own -- rasterio and geopandas
    #     are not published there, and a combined command falls back to the
    #     CUDA build, which does not fit on a runner's disk;
    #   * torchvision comes from the same index in the same command, because
    #     timm imports it. Letting pip resolve torchvision from PyPI pairs a
    #     CUDA-linked build with CPU torch, and importing timm then fails with
    #     "operator torchvision::nms does not exist".
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install PyTorch and torchvision (CPU only, matched build)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install the remaining dependencies
        run: |
          pip install "mmengine==0.10.7" "numpy>=1.24" "pytest>=7.0" \
                      "timm==1.0.19" "rasterio>=1.3" "geopandas>=0.13"
      - name: Report the installed stack
        run: |
          python - <<'PY'
          import geopandas, mmengine, rasterio, timm, torch, torchvision
          for name, module in [('torch', torch), ('torchvision', torchvision),
                               ('timm', timm), ('rasterio', rasterio),
                               ('geopandas', geopandas), ('mmengine', mmengine)]:
              print(f'{name:12s} {module.__version__}')
          PY
      - name: Test
        run: pytest tests/ -q
      - name: Confirm every config still resolves
        run: |
          python - <<'PY'
          import glob
          from mmengine.config import Config
          for path in sorted(glob.glob('configs/**/*.py', recursive=True)):
              Config.fromfile(path, import_custom_modules=False)
              print('ok', path)
          PY
