  python:
    value: '3.9'
    src: code:environment.yml
  python_supported:
    value: '>=3.9'
    src: code:pyproject.toml:10
  torch:
    value: 1.12.1+cu113
    src: code:README.md (Installation)
  torchvision:
    value: 0.13.1+cu113
    src: code:README.md (Installation)
  mmengine:
    value: 0.10.7
    src: code:README.md (Installation)
  mmcv:
    value: '>=2.0.0rc4,<2.2.0'
    src: code:README.md (Installation)
  mmsegmentation:
    value: 1.2.2
    src: code:README.md (Installation)
  mmdet:
    value: 3.3.0
    src: code:README.md (Installation)
  mmpretrain:
    value: 1.2.0
    src: code:README.md (Installation)
  timm:
    value: 1.0.19
