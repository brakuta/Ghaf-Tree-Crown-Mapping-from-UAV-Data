# ---------------------------------------------------------------------------
# 4. The dataset
# ---------------------------------------------------------------------------
dataset:
  layout:
    value:
      training: [training/images, training/masks]
      validation: [validation/images, validation/masks]
      testing: [testing/ghaf26/images, testing/ghaf26/masks]
    src: code:ghaf/splits.py
  pairs:
    training: 7005
    validation: 869
    testing: 767
    total: 8641
    src: measured:WS_1   # python tools\check_dataset.py ..\data\ghaf
  sidecars:
    value: test tiles carry .pgw, .png.aux.xml and .ovr; training and
           validation tiles carry none
    src: code:tools/predict_split.py (module docstring), measured:WS_1
  crs:
    value: EPSG:32640
    src: measured:WS_1   # rasterio open of a test tile and of Kalba26.tif
  canopy_fraction_test_split:
    value: 3.44 per cent across 767 tiles
    src: measured:WS_1   # tools\predict_split.py over the testing split

# ---------------------------------------------------------------------------
# 5. Imagery
# ---------------------------------------------------------------------------
imagery:
  full_mosaic:
    name: Kalba26.tif
    width_px: 84072
    height_px: 103691
    bands: 4
    dtype: uint8
    crs: EPSG:32640
    src: measured:WS_1   # rasterio: 4 ('uint8',)*4 84072 103691 EPSG:32640
    total_px:
      value: 8717509752
      src: derived:84072*103691
    file_size:
      value: 34938536449 bytes
      src: measured:WS_1   # dir G:\ghaf-staging
  sample_clip:
    name: Kalba26_sample.tif
    size_px: [8192, 8192]
    origin_px: [37940, 47749]
    valid_imagery: 100.0 per cent
    file_size: 111.4 MB
    src: measured:WS_1   # tools\make_sample.py
  gsd:
    value: 0.0268 m per pixel
    src: measured:WS_1   # transform of Kalba26_sample.tif
  tile_ground_size:
    value: 27.44 m square, 0.075 ha
    src: derived:1024*0.0268

# ---------------------------------------------------------------------------
# 6. Inference defaults, as the code parses them
#    These are the argparse defaults, not recommendations.
# ---------------------------------------------------------------------------
inference:
  large_image:
    src: code:ghaf/inference/large_image.py:534-570
    tile: 1024
    overlap: 512
    sigma: 0.4
    threshold: 0.5
    bands: [1, 2, 3]
    batch_size: 1
    min_area_m2: 0.0
    device: cuda:0
    scratch_bytes_per_pixel:
      value: 9
      src: code:ghaf/inference/large_image.py:52
    constraint:
      value: at least one of --out-prob, --out-mask, --out-polygons is
             required, and --out-polygons additionally requires --out-mask
             or --out-prob to vectorise from
      src: code:ghaf/inference/large_image.py:565-570
  predict_folder:
    src: code:tools/predict_folder.py
    outputs: polygons only; rasters are opt-in
    polygon_suffix: .gpkg
    threshold: 0.5
    min_area_m2: 0.0
    tile: 1024
    overlap: 512
    batch_size: 1
    suffixes: ['.tif', '.tiff', '.png', '.jpg', '.jpeg', '.jp2', '.vrt']
  predict_split:
    src: code:tools/predict_split.py
    split_default: testing
    threshold: 0.5
    batch_size: 1

# ---------------------------------------------------------------------------
# 7. Runs actually performed
# ---------------------------------------------------------------------------
runs:
  smoke_test_on_bundle:
    src: measured:WS_1
    command: python tools\smoke_test.py --checkpoints ..\models
    result: 6 of 6 models built and ran a forward pass; every digest ok
    tensors_matched:
      fastvit-ma36_mask2former: 1558
      poolformer-s36_fpn: 436
      dpn98_fpn: 676
      convnext-small_upernet: 430
      resnet-50_mask2former: 610
      efficientnet-b3_fpn: 610
    prediction_column: 0.00 per cent ghaf on a blank synthetic tile, expected
  area_wide_sample:
    src: measured:WS_1
    command: python -m ghaf.inference.large_image ... --batch-size 4
    input: Kalba26_sample.tif, 8192 x 8192
    windows: 225
    batches: 57
    wall_clock: 40 s at batch size 4
    canopy_px: 650055
    valid_px: 67108864
    canopy_fraction:
      value: 0.9687 per cent
      src: derived:650055/67108864
    polygons: 27
  folder_sample:
    src: measured:WS_1
    command: python tools\predict_folder.py ... --batch-size 4 --min-area 1
    dropped_under_1_m2: 11
    polygons_written: 16
    canopy_fraction: 0.97 per cent, identical to the area-wide run
  crown_geometry:
    src: measured:WS_1
    crown_area_range: 2.4 to 112 m2
    polygon_area_total: 469 m2
    pixel_area_total: 467 m2
    note: the two agree to within a rounding of the pixel count
  test_suite:
    src: measured:container
    command: python -m pytest tests/ -q
    result: 325 passed, 1 skipped
  full_mosaic_run:
    value: NOT_ESTABLISHED
    src: NOT_ESTABLISHED
    note: the full Kalba26.tif has never been run end to end. The scratch
          requirement and the window count below are arithmetic, not timings.
  full_mosaic_scratch:
    value: 78.5 GB
    src: derived:8717509752*9
  full_mosaic_windows:
    value: 33128
    src: derived:plan_windows(84072, 103691, 1024, 512)
    note: README.md says "roughly 33 500"; the exact figure under the
          documented stepping rule is 33 128.

# ---------------------------------------------------------------------------
# 8. Training configuration, as the config declares it
# ---------------------------------------------------------------------------
training:
  src: code:configs/_base_/ghaf.py
  max_iters: 160000
  val_interval: 3500
  checkpoint_interval: 3500
  save_best: mIoU
  scheduler: PolyLR, power 0.9, eta_min 0, end 160000
  train_batch_size: 2
  val_batch_size: 1
  test_batch_size: 1
  evaluator: IoUMetric with mIoU, mDice, mFscore
  optimiser_fastvit:
    src: code:configs/ghaf/fastvit-ma36_mask2former.py:120
    type: AdamW
    lr: 0.0001
    betas: [0.9, 0.999]
    eps: 1.0e-08
    weight_decay: 0.05
    clip_grad: max_norm 0.01, norm_type 2
  randomness:
    value: not set; the `randomness = dict(seed=0, deterministic=True)` line
           is commented out
    src: code:configs/_base_/ghaf.py:139
    consequence: runs are not bit-reproducible, and the seed mmengine chose
                 exists only in the run log under work_dirs
  wall_clock:
    value: NOT_ESTABLISHED
    src: NOT_ESTABLISHED
    note: no training run was performed or timed in this session. README.md
          says "many hours on one GPU", which is a claim in the repository,
          not a measurement.
  hardware:
    value: NVIDIA RTX A5000
    src: session context, stated by the operator; not verified by any command
         run here

