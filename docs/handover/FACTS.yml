  total: 18.93 GB
  parts:
    code:
      files: 63
      note: exactly what `git ls-files` reports at that commit
    models:
      size: 2.22 GB
      note: six model folders, each a resolved config beside its weights
    init-weights:
      size: 0.90 GB
    data:
      size: 15.64 GB
      files: 19583
      left_behind: 49490
      note: build_handover copies the three named splits only; the working
            tree it was cut from held far more
    samples:
      files: 2
      size: 0.17 GB
      note: Kalba26_sample.tif and its .ovr. The full mosaic is NOT in the
            bundle
    predictions:
      files: 768
      note: 767 test-split masks and one summary.json
  manifest:
    value: MANIFEST.json records every part, its size, its file count and the
           commit the code came from
    src: code:tools/build_handover.py

