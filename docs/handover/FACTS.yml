# FACTS.yml -- the authoritative values for the Ghaf crown-mapping manuals.
#
# Rule: every number printed in the manual or the quick reference is traceable
# to an entry here. Where the manual and this file could disagree, this file
# wins. Nothing in it is inferred, rounded up to a plausible figure, or copied
# from prose that was itself written from memory.
#
# Every entry carries `src`, one of:
#   code:<path>[:<line>]   read out of the repository at the commit below
#   measured:<host>        a command that was actually run, with its output
#   derived:<expression>   arithmetic on other entries in this file
#   NOT_ESTABLISHED        never measured. Say so in the manual; do not guess.
#
# `measured:WS_1` is the training and inference workstation (NVIDIA RTX A5000,
# Windows, conda env `ghaf`, Python 3.9). `measured:container` is the Linux
# container the repository is built and tested in.

meta:
  repository: brakuta/Ghaf-Tree-Crown-Mapping-from-UAV-Data
  commit_of_record:
    value: b120606
    src: measured:container    # git rev-parse --short HEAD, 2026-09-03
  compiled: 2026-09-03
  compiled_by: manual build, this session

# ---------------------------------------------------------------------------
# 1. What the system is
# ---------------------------------------------------------------------------
system:
  task:
    value: two-class semantic segmentation, background and ghaf
    src: code:ghaf/datasets.py:42
  classes:
    value: ['background', 'ghaf']
    src: code:ghaf/datasets.py:42
  mask_encoding:
    value: single band, 0 background, 1 ghaf, reduce_zero_label False
    src: code:ghaf/datasets.py:35-51
  tile_size_px:
    value: [1024, 1024]
    src: code:configs/_base_/ghaf.py:25
  tile_format:
    value: PNG pairs, image and mask sharing a filename stem
    src: code:ghaf/datasets.py:47-48
  framework:
    value: mmsegmentation overlay; nothing inside mmseg is modified
    src: code:README.md

# ---------------------------------------------------------------------------
# 2. Software versions
# ---------------------------------------------------------------------------
