# Conda environment for Ghaf crown mapping.
#
#   conda env create -f environment.yml
#   conda activate ghaf
#   pip install -e .
#   python tools/smoke_test.py

name: ghaf
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - pytorch=1.12.1
  - torchvision=0.13.1
  - cudatoolkit=11.3
  - gdal=3.9.2
  - numpy>=1.24
  - pip
  - pip:
      - openmim
      - mmengine==0.10.7
      - mmcv>=2.0.0rc4,<2.2.0
      - mmsegmentation==1.2.2
      - mmdet==3.3.0
      - mmpretrain==1.2.0
      - timm==1.0.19
      - rasterio>=1.3
      - geopandas>=0.13
      - shapely>=2.0
      - tqdm>=4.65
      - pytest>=7.0
