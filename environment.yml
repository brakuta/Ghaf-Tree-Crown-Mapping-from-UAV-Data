# Conda environment for Ghaf crown mapping.
#
#   conda env create -f environment.yml
#   conda activate ghaf
#
# then follow the installation steps in the README.
#
# Conda supplies only the interpreter. The rest is installed with pip and
# openmim, for two reasons:
#
#   * mmcv is distributed as prebuilt wheels matched to a specific
#     torch/CUDA pair. `mim install` picks the right one; plain pip usually
#     falls back to building from source, which needs a compiler toolchain.
#   * pinning PyTorch and GDAL through conda forces a CUDA toolkit and a GDAL
#     build to agree with each other, which has no solution on some platforms.
#     rasterio ships its own GDAL, so none is needed here.

name: ghaf
channels:
  - conda-forge
dependencies:
  - python=3.9
  - pip
